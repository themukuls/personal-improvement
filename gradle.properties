# Gradle 8.9 supports JDK 17-21 only; JAVA_HOME here points at JDK 25, which its
# embedded Kotlin script compiler cannot parse (IllegalArgumentException: 25).
# Pin the build to the installed Temurin 21 so it ignores JAVA_HOME.
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-21.0.11.10-hotspot
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
